<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teams Meeting Companion</title><style>body{font:16px system-ui;margin:40px;max-width:720px}input,button{padding:10px;margin:6px 0;width:100%}button{cursor:pointer}.card{border:1px solid #ddd;padding:20px;border-radius:12px}pre{white-space:pre-wrap}</style></head><body><div class="card"><h1>Teams Meeting Companion</h1><p>Enter a Teams meeting URL, request visible join, and load the final transcript.</p><input id="url" placeholder="https://teams.microsoft.com/l/meetup-join/..."><button id="join">Request join</button><button id="transcript">Get transcript</button><pre id="status"></pre><pre id="result"></pre></div><script>const s=document.querySelector('#status'),o=document.querySelector('#result');document.querySelector('#join').onclick=async()=>{if(!document.querySelector('#url').value.trim())return s.textContent='Enter a meeting URL.';s.textContent='Requesting visible join...';const r=await fetch('/api/meetings/local/join',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({tenantId:'local',userId:'local-user',kind:'OnlineMeeting',joinUrl:document.querySelector('#url').value,confirmed:true})});s.textContent=await r.text()};document.querySelector('#transcript').onclick=async()=>{s.textContent='Loading transcript...';const r=await fetch('/api/meetings/local/transcript');const d=await r.json();if(!r.ok)return s.textContent=d.error||'Transcript unavailable.';o.textContent=d.utterances.map(x=>`[${x.start}] ${x.speaker||'Unknown'}: ${x.text}`).join('\\n');s.textContent='Transcript loaded.'};</script></body></html>
