<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teams Meeting Companion</title><style>body{font:16px system-ui;margin:40px;max-width:720px}input,button{padding:10px;margin:6px 0;width:100%}button{cursor:pointer}.card{border:1px solid #ddd;padding:20px;border-radius:12px}pre{white-space:pre-wrap}</style></head><body><div class="card"><h1>Teams Meeting Companion</h1><p>Enter a Teams meeting URL, request visible join, and load the final transcript.</p><label>Local API URL (ngrok)</label><input id="api" placeholder="https://your-ngrok-url.ngrok-free.app"><input id="url" placeholder="https://teams.microsoft.com/l/meetup-join/..."><button id="join">Request join</button><button id="transcript">Get transcript</button><pre id="status"></pre><pre id="result"></pre></div><script>const q=new URLSearchParams(location.search),api=document.querySelector('#api');api.value=q.get('api')||localStorage.getItem('companionApi')||'';const s=document.querySelector('#status'),o=document.querySelector('#result');const base=()=>{const v=api.value.trim().replace(/\/$/,'');localStorage.setItem('companionApi',v);return v};document.querySelector('#join').onclick=async()=>{try{const b=base();if(!b)return s.textContent='Enter the local API URL first.';if(!document.querySelector('#url').value.trim())return s.textContent='Enter a meeting URL.';s.textContent='Requesting visible join...';const r=await fetch(b+'/api/meetings/local/join',{method:'POST',headers:{'content-type':'application/json','ngrok-skip-browser-warning':'1'},body:JSON.stringify({tenantId:'local',userId:'local-user',kind:'OnlineMeeting',joinUrl:document.querySelector('#url').value,confirmed:true})});s.textContent=await r.text()}catch(e){s.textContent='API connection failed: '+e.message}};document.querySelector('#transcript').onclick=async()=>{try{const r=await fetch(base()+'/api/meetings/local/transcript',{headers:{'ngrok-skip-browser-warning':'1'}});const d=await r.json();if(!r.ok)return s.textContent=d.error||'Transcript unavailable.';o.textContent=d.utterances.map(x=>`[${x.start}] ${x.speaker||'Unknown'}: ${x.text}`).join('\n');s.textContent='Transcript loaded.'}catch(e){s.textContent='API connection failed: '+e.message}};</script></body></html>
