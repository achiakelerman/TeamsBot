<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teams Meeting Companion</title><style>body{font:16px system-ui;margin:40px;max-width:720px}input,button{padding:10px;margin:6px 0;width:100%}button{cursor:pointer}.card{border:1px solid #ddd;padding:20px;border-radius:12px}</style></head><body><div class="card"><h1>Teams Meeting Companion</h1><p>Paste a Teams meeting link. The local companion will ask for confirmation before joining.</p><input id="url" placeholder="https://teams.microsoft.com/l/meetup-join/..."><input id="name" value="Meeting Companion" placeholder="Participant name"><button id="join">Request join</button><pre id="status"></pre></div><script>const s=document.querySelector('#status');document.querySelector('#join').onclick=async()=>{const u=document.querySelector('#url').value.trim();if(!u)return s.textContent='Enter a meeting URL.';s.textContent='Sending join request...';const r=await fetch('/api/meetings/local/join',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({tenantId:'local',userId:'local-user',kind:'OnlineMeeting',joinUrl:u,confirmed:true})});s.textContent=await r.text();};</script></body></html>
